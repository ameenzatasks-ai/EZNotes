<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2ndBrain AI logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1633"/>
      <stop offset="1" stop-color="#150f23"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3f56a"/>
      <stop offset="1" stop-color="#ade03f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#c2ef4e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2ef4e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App-icon badge -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="78" cy="96" r="2.4" opacity=".5"/>
    <circle cx="430" cy="120" r="2" opacity=".4"/>
    <circle cx="120" cy="420" r="2" opacity=".4"/>
    <circle cx="402" cy="404" r="2.6" opacity=".45"/>
    <circle cx="360" cy="70" r="1.6" opacity=".35"/>
    <circle cx="64" cy="300" r="1.6" opacity=".3"/>
    <circle cx="452" cy="270" r="1.8" opacity=".35"/>
  </g>

  <!-- glow behind brain -->
  <circle cx="232" cy="228" r="190" fill="url(#glow)"/>

  <!-- BRAIN: base body + same-color bumps form a lobed silhouette -->
  <g fill="url(#lime)">
    <ellipse cx="232" cy="228" rx="150" ry="140"/>
    <circle cx="150" cy="150" r="40"/>
    <circle cx="208" cy="120" r="42"/>
    <circle cx="270" cy="124" r="40"/>
    <circle cx="318" cy="160" r="38"/>
    <circle cx="96"  cy="214" r="40"/>
    <circle cx="110" cy="294" r="40"/>
    <circle cx="178" cy="338" r="42"/>
    <circle cx="262" cy="338" r="40"/>
    <circle cx="330" cy="300" r="38"/>
    <circle cx="352" cy="226" r="36"/>
  </g>

  <!-- brain folds (sulci) + center seam, in midnight violet -->
  <g fill="none" stroke="#1f1633" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- center seam -->
    <path d="M232 108 C 246 150 220 196 236 232 C 252 268 222 312 232 350"/>
    <!-- left hemisphere swirls -->
    <path d="M170 170 C 132 188 132 236 168 248 C 138 262 142 304 178 306"/>
    <path d="M150 232 C 128 240 128 268 150 276"/>
    <!-- right hemisphere swirls -->
    <path d="M298 168 C 336 188 334 232 300 246 C 330 260 326 300 292 304"/>
    <path d="M316 230 C 338 238 338 266 316 274"/>
  </g>

  <!-- PLAY badge (video → brain) bottom-right -->
  <circle cx="386" cy="388" r="62" fill="#150f23"/>
  <circle cx="386" cy="388" r="54" fill="#fa7faa"/>
  <path d="M370 362 L416 388 L370 414 Z" fill="#150f23"/>
</svg>
